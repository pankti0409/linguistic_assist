[project]
name = "ps16-backend"
version = "0.0.0"
description = "PS-16 multimodal communication assistant backend (assistive proof of concept)"
requires-python = ">=3.10,<3.12"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs real API keys/hardware; skipped unless RUN_LIVE=1"]
